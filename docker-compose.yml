services:
  mysql:
    # 国内网络可直接拉取；若已配置 Docker 镜像加速，可改回 mysql:8.0
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: learning-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: learning_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: learning-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nacos:
    image: docker.m.daocloud.io/nacos/nacos-server:v2.2.3
    container_name: learning-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "false"
      # 规避 Docker cgroup v2 下旧版 JDK 读取容器指标时的 NPE，导致反复重启
      JAVA_OPT: "-XX:-UseContainerSupport"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"

volumes:
  mysql_data:
  redis_data:
