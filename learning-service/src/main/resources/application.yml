server:
  port: 8081

spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/learning_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

dubbo:
  application:
    name: learning-service
    qos-enable: false
  protocol:
    name: dubbo
    port: 20880
  registry:
    address: nacos://127.0.0.1:8848
  scan:
    base-packages: com.example.learning.service.dubbo

logging:
  level:
    com.example.learning: info
